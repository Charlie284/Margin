name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Analyze
        run: >-
          xcodebuild -project Margin.xcodeproj -scheme Margin -configuration Debug
          -destination 'platform=macOS' -derivedDataPath build/ci-analyze
          analyze CODE_SIGNING_ALLOWED=NO
      - name: Test
        run: >-
          xcodebuild -project Margin.xcodeproj -scheme Margin -configuration Debug
          -destination 'platform=macOS' -derivedDataPath build/ci-tests
          test CODE_SIGNING_ALLOWED=NO -skip-testing:MarginUITests
      - name: UI smoke test
        run: >-
          xcodebuild -project Margin.xcodeproj -scheme Margin -configuration Debug
          -destination 'platform=macOS' -derivedDataPath build/ci-ui-tests
          test CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
          -only-testing:MarginUITests/MarginUITests/testPresentationControlsSwitchModes
      - name: Build universal Release
        run: >-
          xcodebuild -project Margin.xcodeproj -scheme Margin -configuration Release
          -destination 'generic/platform=macOS' -derivedDataPath build/ci-release
          ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
      - name: Validate bundled products
        run: |
          app=build/ci-release/Build/Products/Release/Margin.app
          ql="$app/Contents/PlugIns/MarginQuickLook.appex"
          test "$(plutil -extract NSExtension.NSExtensionAttributes.QLSupportedContentTypes.0 raw "$ql/Contents/Info.plist")" = "net.daringfireball.markdown"
          for binary in "$app/Contents/MacOS/Margin" "$app/Contents/SharedSupport/bin/margin" "$ql/Contents/MacOS/MarginQuickLook"; do
            archs=$(lipo -archs "$binary")
            [[ " $archs " == *" arm64 "* ]]
            [[ " $archs " == *" x86_64 "* ]]
          done
      - name: Exercise CLI validation
        run: |
          cli=build/ci-release/Build/Products/Release/margin
          "$cli" --help
          version=$("$cli" --version)
          if [[ "$version" == "margin development" ]]; then
            echo 'CLI could not discover the app version' >&2
            exit 1
          fi
          if "$cli" --unknown; then
            echo 'Unknown option unexpectedly succeeded' >&2
            exit 1
          fi
          "$cli" export Samples/Welcome.md --html --output build/cli-check.html
          test -s build/cli-check.html
          if "$cli" export Samples/Welcome.md --html --output build/cli-check.html; then
            echo 'Existing output was overwritten without --force' >&2
            exit 1
          fi
          "$cli" export Samples/Welcome.md --html --output build/cli-check.html --force
